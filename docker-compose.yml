services:
  gentle-walk:
    build:
      context: .
      dockerfile: Dockerfile
    image: gentle-walk:latest
    container_name: gentle-walk-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - GENTLEWALK_CORS_ALLOWED_ORIGINS=http://localhost:8080,http://localhost:5173,http://localhost:3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    resources:
      limits:
        cpus: '1.5'
        memory: 1024M
      reservations:
        memory: 512M
